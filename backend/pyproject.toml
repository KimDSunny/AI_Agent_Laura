[project]
name = "planet-laura-api"
version = "0.1.0"
description = "FastAPI backend for the PLANET onboarding AI agent"
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "langgraph>=1.2.11",
  "openai>=3.14.0",
  "pydantic-settings==2.15.0",
  "supabase==2.31.0",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
